spring.application.name=inventario

# Expone el mensaje real de las excepciones en la respuesta de error (ej. "Credenciales invalidas",
# "El activo no esta disponible para asignar") en vez del 500 generico por defecto de Spring Boot.
spring.web.error.include-message=always

spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${DB_LINK}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Cedula y correo del empleado administrador que se crea (si no existe) al arrancar
# la app (ver DatosInicialesSeeder). Nunca hardcodear datos reales aqui ni en el codigo.
app.seed.admin-cedula=${ADMIN_CEDULA}
app.seed.admin-correo=${ADMIN_CORREO}

# Carpeta con las plantillas PDF de actas (AcroForm). Rutas relativas al
# directorio de trabajo del proceso (backend/ si se corre con mvn spring-boot:run).
app.actas.plantillas-dir=plantillas/actas
# Carpeta donde se guardan las actas ya rellenadas: {oficina}/{nombre apellido}/{entrega|devolucion}/acta-{id}.pdf
app.actas.generadas-dir=actas-generadas

# Credenciales de Mailtrap para el correo de recuperacion de contrasena.
# Todas obligatorias: sin valor por defecto, para que un despliegue sin configurar
# falle al arrancar en vez de enviar correos con datos incorrectos silenciosamente.
app.mail.mailtrap-token=${MAILTRAP_API_TOKEN}
app.mail.from-email=${MAILTRAP_FROM_EMAIL}
app.mail.from-name=${MAILTRAP_FROM_NAME}
# Modo sandbox (Email Sandbox de Mailtrap): no requiere dominio verificado, los
# correos se capturan en la inbox de pruebas en vez de entregarse de verdad.
# Poner MAILTRAP_SANDBOX=false cuando se use un dominio real (Sending API).
app.mail.sandbox=${MAILTRAP_SANDBOX}
# Id de la inbox de pruebas de Mailtrap (obligatorio si app.mail.sandbox=true).
app.mail.inbox-id=${MAILTRAP_INBOX_ID}
# Carpeta con las plantillas HTML de correos (misma convencion que app.actas.plantillas-dir).
# Placeholders soportados: {{nombre}}, {{enlace}}.
app.mail.plantillas-dir=plantillas/correos

# Origen del frontend, usado para construir el enlace de restablecimiento de contrasena.
# Obligatoria: un default a localhost aqui rompería en silencio el enlace del correo
# si se despliega sin configurar esta variable.
app.frontend.base-url=${FRONTEND_URL}
